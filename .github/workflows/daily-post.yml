name: Daily TikTok image posts
on:
  schedule:
    - cron: "17 13 * * *"   # morning post, about 8:17 AM New York (winter time)
    - cron: "17 15 * * *"   # morning backup, in case the first run is skipped
    - cron: "17 22 * * *"   # evening post, about 5:17 PM New York
    - cron: "17 0 * * *"    # evening backup (7:17 PM New York)
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: autoposter
  cancel-in-progress: false
jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
      BUFFER_CHANNEL_ID: ${{ secrets.BUFFER_CHANNEL_ID }}
      GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
      GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
      REPORT_EMAIL: ${{ secrets.REPORT_EMAIL }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Write the post and make the image
        run: python generate.py
      - name: Save new files (so the image has a public link)
        run: |
          git config user.name "autoposter"
          git config user.email "autoposter@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || (git commit -m "New post image" && git pull --rebase && git push)
      - name: Send to Buffer and email report
        run: python publish.py
      - name: Save history
        if: always()
        run: |
          git add -A
          git diff --cached --quiet || (git commit -m "Update history" && git pull --rebase && git push)
